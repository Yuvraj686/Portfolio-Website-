<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Yuvraj Garg</title>
    <meta name="robots" content="noindex">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* Scoped 404 page styles */
        .not-found-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background: var(--bg-primary);
            transition: background 0.3s ease;
        }

        .not-found-inner {
            max-width: 480px;
        }

        .not-found-code {
            font-size: 7rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            letter-spacing: -0.04em;
        }

        .not-found-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--section-title-color);
            margin-bottom: 0.8rem;
            transition: color 0.3s ease;
        }

        .not-found-text {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 2.2rem;
            line-height: 1.7;
            transition: color 0.3s ease;
        }

        .not-found-btn {
            display: inline-block;
            padding: 0.85rem 2rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            transition: opacity 0.25s, transform 0.2s;
        }

        .not-found-btn:hover {
            opacity: 0.88;
            transform: translateY(-2px);
            color: white;
        }

        .not-found-icon {
            font-size: 3rem;
            margin-bottom: 1.2rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: block;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <div class="logo">Yuvraj Garg</div>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
            </ul>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                <i class="fa fa-moon-o" id="theme-icon"></i>
            </button>
        </nav>
    </header>

    <div class="not-found-page">
        <div class="not-found-inner">
            <span class="not-found-icon fa fa-compass"></span>
            <div class="not-found-code">404</div>
            <h1 class="not-found-title">Page Not Found</h1>
            <p class="not-found-text">
                Looks like this page took a wrong turn somewhere.<br>
                Let's get you back on track.
            </p>
            <a href="/" class="not-found-btn">
                <i class="fa fa-home"></i> Back to Home
            </a>
        </div>
    </div>

    <script>
        // Minimal dark mode sync for 404 page
        (function () {
            var theme = localStorage.getItem('portfolio-theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
            var icon = document.getElementById('theme-icon');
            if (icon) icon.className = theme === 'dark' ? 'fa fa-sun-o' : 'fa fa-moon-o';

            var btn = document.getElementById('theme-toggle');
            if (btn) {
                btn.addEventListener('click', function () {
                    var current = document.documentElement.getAttribute('data-theme');
                    var next = current === 'dark' ? 'light' : 'dark';
                    document.documentElement.setAttribute('data-theme', next);
                    localStorage.setItem('portfolio-theme', next);
                    if (icon) icon.className = next === 'dark' ? 'fa fa-sun-o' : 'fa fa-moon-o';
                });
            }
        })();
    </script>
</body>

</html>
